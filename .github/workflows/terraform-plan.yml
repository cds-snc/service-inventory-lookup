name: Terraform plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "service_en.html"
      - "service_fr.html"
      - "service.js"
      - "services.json"
      - "program_en.html"
      - "program_fr.html"
      - "program.js"
      - "program_codes.json"
      - "security.txt"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ca-central-1
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ vars.SDR_AWS_ACCOUNT }}:role/service-inventory-lookup-plan
          role-session-name: TFPlan
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0
        env:
          TERRAFORM_VERSION: 1.14.8

      - name: Terraform plan
        uses: cds-snc/terraform-plan@529b272050a8f718d14c59e62b59c124eead7efc # v5.0.4
        with:
          directory: infra
          github-token: ${{ secrets.GITHUB_TOKEN }}
