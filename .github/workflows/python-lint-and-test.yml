# Python CI — lint with ruff and run pytest via uv

name: Python Lint and Test

permissions:
  contents: read

on:
  push:
    paths:
      - "update_data.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-lint-and-test.yml"
  pull_request:
    paths:
      - "update_data.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-lint-and-test.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.0.0

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "format --check"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen pytest
