# This name is referenced by terraform-apply.yml's workflow_run trigger;
# rename them together or the deploy chain silently breaks.
name: Update data

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Run update scripts
        run: |
          uv run update_services.py
          uv run update_programs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services.json program_codes.json
          if git diff --staged --quiet; then
            echo "No changes to data files; nothing to commit."
          else
            git commit -m "chore: refresh data files" -m "Automated weekly refresh via GitHub Actions."
            git push
          fi
