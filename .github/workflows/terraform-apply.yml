name: Terraform apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "service_en.html"
      - "service_fr.html"
      - "service.js"
      - "services.json"
      - "program_en.html"
      - "program_fr.html"
      - "program.js"
      - "program_codes.json"
      - "security.txt"
      - ".github/workflows/terraform-apply.yml"
  workflow_run:
    workflows:
      # Must match the name in update-data.yml exactly; rename them together.
      - "Update data"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.SDR_AWS_ACCOUNT }}:role/service-inventory-lookup-apply
          role-session-name: TFApply
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0
        env:
          TERRAFORM_VERSION: 1.14.8

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve -input=false
