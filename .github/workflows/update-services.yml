name: Update services.json

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run update script
        run: uv run update-data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services.json
          if git diff --staged --quiet; then
            echo "No changes to services.json; nothing to commit."
          else
            git commit -m "chore: refresh services.json" -m "Automated weekly refresh via GitHub Actions."
            git push
          fi